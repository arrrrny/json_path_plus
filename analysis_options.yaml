# Static analysis configuration.
#
# `package:lints/recommended.yaml` is the base set — the same set pub.dev
# scores against. On top of it we opt into a small number of extra rules that
# suit a zero-dependency library, all of which the codebase passes cleanly.
#
# Rules deliberately NOT enabled, and why:
#   - `prefer_final_parameters` — 210 hits; the codebase treats public API
#     parameters as deliberately re-assignable in several evaluator paths.
#   - `require_trailing_commas` — fights the Dart 3.7+ formatter, which owns
#     trailing-comma placement now.

include: package:lints/recommended.yaml

linter:
  rules:
    # Zero-cost correctness rules — already clean.
    - always_declare_return_types
    - unawaited_futures

    # Immutability / precision — keeps local state explicit.
    - prefer_final_locals
    - omit_local_variable_types

    # The engine intentionally walks untyped JSON with `dynamic`; this rule
    # keeps that confined to the places that must be dynamic.
    - avoid_dynamic_calls
